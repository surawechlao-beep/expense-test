<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งรหัสผ่านใหม่ — EXION</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/experience.css"></head><body><header class="header"><h1><img class="logo" src="icons/logo.png" alt="EXION"> ตั้งรหัสผ่านใหม่</h1></header><main class="container" style="max-width:520px"><div class="card" style="padding:28px"><div class="eyebrow">ACCOUNT RECOVERY</div><h2 style="font-size:24px;margin:12px 0">กลับเข้าสู่พื้นที่ทำงาน</h2><p class="subtle" style="line-height:1.9;margin-bottom:24px">กรอกอีเมลเพื่อแจ้งหัวหน้า จากนั้นรับรหัสตั้งบัญชีจากหัวหน้า และนำไปใช้ในหน้าเข้าสู่ระบบ</p><form id="resetForm"><div class="field"><label for="resetEmail">อีเมลบริษัท</label><input type="email" id="resetEmail" autocomplete="username" required></div><button class="btn btn-primary" style="width:100%">แจ้งหัวหน้าเพื่อขอตั้งรหัสใหม่</button><p id="resetStatus" role="status" class="subtle" style="margin:18px 0;line-height:1.8"></p></form><a href="index.html" class="btn btn-secondary" style="width:100%">กลับไปเข้าสู่ระบบ / ตั้งรหัสใหม่</a></div></main><script src="js/config.js"></script><script src="js/icons.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/experience.js"></script><script>document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button'),status=document.getElementById('resetStatus');btn.disabled=true;try{const r=await requestPasswordReset(document.getElementById('resetEmail').value.trim());status.textContent=r.message;}catch(err){status.textContent=err.message;}finally{btn.disabled=false;}};</script></body></html>
